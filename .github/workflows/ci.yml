name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Skill and project tools
        run: python3 fyuu-tutor/scripts/test_fyuu_tutor.py
      - name: Check local links
        run: python3 fyuu-tutor/scripts/check_links.py --root .
      - name: UI kit self-test
        run: python3 fyuu-tutor/scripts/validate_lesson_ui.py --self-test
      - name: UI kit consistency
        run: python3 fyuu-tutor/scripts/validate_lesson_ui.py --kit
      - name: Audit public boundary
        run: python3 fyuu-tutor/scripts/audit_privacy.py --system .
      - name: Compile-check all Python scripts
        run: python3 -m py_compile fyuu-tutor/scripts/validate_lesson_ui.py fyuu-tutor/scripts/validate_project.py fyuu-tutor/scripts/audit_privacy.py fyuu-tutor/scripts/build_portal.py fyuu-tutor/scripts/project_config.py fyuu-tutor/scripts/update_status.py fyuu-tutor/scripts/build_index.py fyuu-tutor/scripts/check_links.py fyuu-tutor/scripts/pdf/ocr_pdf.py fyuu-tutor/scripts/pdf/convert_pdf.py fyuu-tutor/scripts/pipelines/language/cantonese/convert_pronunciation.py
      - name: JavaScript syntax check
        run: node --check fyuu-tutor/assets/ui-kit/assets/lesson.js
      - name: Shell syntax check
        run: bash -n fyuu-tutor/scripts/deploy_portal.sh
      - name: Check release version
        shell: bash
        run: |
          grep -qE "^[0-9]+\.[0-9]+\.[0-9]+$" VERSION || { echo "VERSION must be X.Y.Z"; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
          fi
