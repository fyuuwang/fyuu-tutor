      <p class="section-intro">同一個字，在粵語和普通話裡意思可能完全不同。以下是最常踩坑的字。</p>

        <thead><tr><th>字</th><th>普通話意思</th><th>粵語意思</th><th>粵拼</th></tr></thead>

          <tr><td>睇</td><td>（不用）</td><td>看</td><td>tai<sup>2</sup></td></tr>
          <tr><td>諗</td><td>（不用）</td><td>想/思考</td><td>nam<sup>2</sup></td></tr>
