<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">Fyuu Tutor</title>
  <desc id="desc">Fyuu Tutor turns materials, question banks, or learning goals into an adaptive learning project that plans the next lesson from the learner's response.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55D6BE"/>
    </marker>
  </defs>

  <rect width="1200" height="400" rx="28" fill="#0B1020"/>
  <path d="M 518 40 V 360" stroke="#29324A" stroke-width="1"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="60" y="58" fill="#55D6BE" font-size="14" font-weight="700" letter-spacing="2.2">ADAPTIVE TUTORING FOR CODEX</text>
    <text x="60" y="132" fill="#F8FAFC" font-size="62" font-weight="760" letter-spacing="-2">Fyuu Tutor</text>
    <text x="60" y="178" fill="#D8DFEC" font-size="23">Turn your materials into</text>
    <text x="60" y="210" fill="#D8DFEC" font-size="23">the next right lesson.</text>

    <text x="60" y="260" fill="#77839B" font-size="12" font-weight="700" letter-spacing="1.6">THREE WAYS TO LEARN</text>
    <g font-size="16" font-weight="650">
      <rect x="60" y="278" width="126" height="42" rx="21" fill="#152136" stroke="#36506A"/>
      <text x="123" y="305" fill="#EAF0F7" text-anchor="middle">Concepts</text>
      <rect x="198" y="278" width="116" height="42" rx="21" fill="#152136" stroke="#36506A"/>
      <text x="256" y="305" fill="#EAF0F7" text-anchor="middle">Exams</text>
      <rect x="326" y="278" width="132" height="42" rx="21" fill="#152136" stroke="#36506A"/>
      <text x="392" y="305" fill="#EAF0F7" text-anchor="middle">Languages</text>
    </g>
    <text x="60" y="362" fill="#77839B" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">v0.3.0 preview  ·  private learning projects</text>
  </g>

  <g id="learning-loop" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="560" y="58" fill="#77839B" font-size="12" font-weight="700" letter-spacing="1.6">START WITH</text>

    <g font-size="15" font-weight="650">
      <rect x="560" y="74" width="164" height="44" rx="12" fill="#111A2B" stroke="#293B53"/>
      <text x="642" y="101" fill="#EAF0F7" text-anchor="middle">Materials</text>
      <rect x="738" y="74" width="184" height="44" rx="12" fill="#111A2B" stroke="#293B53"/>
      <text x="830" y="101" fill="#EAF0F7" text-anchor="middle">Question bank</text>
      <rect x="936" y="74" width="150" height="44" rx="12" fill="#111A2B" stroke="#293B53"/>
      <text x="1011" y="101" fill="#EAF0F7" text-anchor="middle">A goal</text>
    </g>

    <path d="M 642 118 V 136 H 830" fill="none" stroke="#35445C" stroke-width="1.5"/>
    <path d="M 830 118 V 136" fill="none" stroke="#35445C" stroke-width="1.5"/>
    <path d="M 1011 118 V 136 H 830" fill="none" stroke="#35445C" stroke-width="1.5"/>
    <path d="M 830 136 V 149" fill="none" stroke="#55D6BE" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="638" y="154" width="384" height="72" rx="16" fill="#142739" stroke="#55D6BE" stroke-width="1.5"/>
    <text x="664" y="181" fill="#55D6BE" font-size="12" font-weight="750" letter-spacing="1.4">PRIVATE LEARNING PROJECT</text>
    <text x="664" y="207" fill="#F8FAFC" font-size="18" font-weight="650">Plan · lessons · progress · weak areas</text>

    <path d="M 830 226 V 246 H 616 V 254" fill="none" stroke="#55D6BE" stroke-width="2" marker-end="url(#arrow)"/>

    <g font-size="13" font-weight="750" letter-spacing="0.7">
      <rect x="560" y="260" width="112" height="50" rx="14" fill="#101A2A" stroke="#35445C"/>
      <text x="616" y="291" fill="#D8DFEC" text-anchor="middle">PLAN</text>
      <path d="M 672 285 H 692" stroke="#55D6BE" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="700" y="260" width="142" height="50" rx="14" fill="#173143" stroke="#55D6BE"/>
      <text x="771" y="291" fill="#F8FAFC" text-anchor="middle">NEXT LESSON</text>
      <path d="M 842 285 H 862" stroke="#55D6BE" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="870" y="260" width="150" height="50" rx="14" fill="#101A2A" stroke="#35445C"/>
      <text x="945" y="291" fill="#D8DFEC" text-anchor="middle">YOUR RESPONSE</text>
      <path d="M 1020 285 H 1040" stroke="#55D6BE" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="1048" y="260" width="100" height="50" rx="14" fill="#101A2A" stroke="#35445C"/>
      <text x="1098" y="291" fill="#D8DFEC" text-anchor="middle">ADAPT</text>
    </g>

    <path d="M 1098 310 C 1098 350 771 350 771 314" fill="none" stroke="#55D6BE" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="829" y="330" width="204" height="28" rx="14" fill="#0B1020"/>
    <text x="931" y="349" fill="#8FA0B8" font-size="13" text-anchor="middle">repeat from real learning evidence</text>
  </g>
</svg>
